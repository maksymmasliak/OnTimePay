services:
  composer:
    build:
      context: ./docker/php
    command: ["composer", "install", "--no-interaction", "--prefer-dist"]
    volumes:
      - ./src:/var/www/html

  migrate:
    build:
      context: ./docker/php
    command: ["php", "artisan", "migrate", "--force"]
    volumes:
      - ./src:/var/www/html
    depends_on:
      composer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  app:
    build:
      context: ./docker/php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      composer:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  queue-worker:
    build:
      context: ./docker/php
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - ./src:/var/www/html
    depends_on:
      composer:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: ./docker/php
    restart: unless-stopped
    command: cron -f
    user: root
    volumes:
      - ./src:/var/www/html
    depends_on:
      composer:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

volumes:
  postgres-data: